services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGODB_URI=mongodb+srv://hospitaladmin:Hospital123@cluster1.bhy6no3.mongodb.net/hospital-db?retryWrites=true&w=majority
      - JWT_SECRET=hospital-super-secret-jwt-key-change-in-production-2024
      - JWT_EXPIRE=24h
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "4000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped